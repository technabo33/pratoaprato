kind = "web"
previewPath = "/"
title = "Prato a Prato"
description = "Uma app PWA para planear refeições semanais, guardar receitas e gerar listas de compras no telemóvel, com todos os dados armazenados localmente no dispositivo."
version = "1.0.0"
id = "artifacts/meal-planner"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23479

[services.development]
run = "pnpm --filter @workspace/meal-planner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/meal-planner", "run", "build" ]
serve = "static"
publicDir = "artifacts/meal-planner/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23479"
BASE_PATH = "/"
